# Slovník pro ODHAD mapování neznámého formátu (msgvalidator/guess).
#
# Všechny výrazy se porovnávají normalizovaně: malá písmena, bez diakritiky, bez mezer / _ / - / teček
# ("Datum vystavení" = "datum_vystaveni" = "DatumVystaveni" = "datumvystaveni").
# Shoda celého názvu pole = nejsilnější, výraz na začátku / konci názvu = slabší, výraz uvnitř (min. 4 znaky) = nejslabší.
# Přidávejte klidně další synonyma – nic dalšího se měnit nemusí.

