# Mapování EANCOM / GS1 CZ INVOIC (D.96A EAN008, D.01B EAN011) -> sémantický model EN 16931 (BT/BG)
#
# Zdroj: GS1 CZ MIG INVOIC D96A v2.02, INVOIC D01B S3 v2.06 (EDITEL), číslování proměnných (1-1 …)
# odpovídá kapitole 5 MIG a Billa/COOP "PEPPOL-BIS3.0_SK_FMCG" tabulkám.
#
# Formát pravidla:
#   path:    selektor (viz msgvalidator/semantic/selector.py), např. "NAD[1.1=SU] > RFF[1.1=VA]"
#   value:   "prvek.komponenta" segmentu nalezeného posledním krokem (1-based, 1 = první prvek za tagem)
#   join:    [ "4.1", "4.2" ] – spojí více komponent mezerou (např. jméno NAD rozdělené do 5×35 znaků)
#   map:     převod hodnot formátu na hodnoty cílového modelu (např. jednotka PCE -> H87)
#   scheme:  identifikátor schématu, který se doplní (např. 0088 = GLN, 0160 = GTIN)
#   derive:  název odvozovací funkce (msgvalidator/semantic/derive.py) – hodnota NENÍ ve zprávě explicitně
#   const:   hodnotu doplní konverze (není součástí EDIFACT, např. BT-24)
#   versions: omezení na verze (D96A / D01B); bez uvedení platí pro obě
#   var:     odkaz na proměnnou MIG (1-1 = CIS_DOKL …)
#   note:    poznámka pro analytika (zobrazí se v reportu)
# U jednoho BT se pravidla zkouší v uvedeném pořadí; první, které vrátí hodnotu, vyhrává.
#
# groups: kde se opakující se skupiny BG nacházejí
#   scope: header | line | summary
#   each:  selektor instance skupiny (BT pod ní se pak vyhodnocují relativně, '@' = trigger skupiny)
#   skip_if_missing: instance bez kteréhokoli z uvedených BT se považuje za prázdnou (konverze ji vynechá)

id: edifact-invoic-eancom
format: EDIFACT
message: INVOIC
versions: [D96A, D01B]

groups:
  BG-20: {scope: header, each: "ALC[1.1=A]", skip_if_missing: [BT-92, BT-94]}
  BG-21: {scope: header, each: "ALC[1.1=C]", skip_if_missing: [BT-99, BT-101]}
  BG-23: {scope: summary, each: "TAX[1.1=7;2.1=VAT]", skip_if_missing: [BT-116, BT-119]}
  BG-25: {scope: line, each: "LIN"}
  # GS1 CZ: řádkové ALC+A (SG39) = sleva NA JEDNOTKU (= PRI AAB − AAA) -> BT-147, ne BG-27 řádková sleva.
  #         řádkové ALC+C s AEO/AEP = recyklační / autorský poplatek -> BG-28 řádková přirážka.
  BG-28: {scope: line, parent: BG-25, each: "ALC[1.1=C]"}

